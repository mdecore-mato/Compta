<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compta — Test</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%);
    color: white;
  }
  .card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    max-width: 400px;
  }
  h1 { margin: 0 0 10px; font-size: 2em; }
  p { opacity: 0.85; line-height: 1.5; }
  .ok { font-size: 3em; margin-bottom: 10px; }
  button {
    margin-top: 20px;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background: #40916c;
    color: white;
    font-size: 1em;
    cursor: pointer;
  }
  button:active { background: #2d6a4f; }
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✅</div>
    <h1>Ça fonctionne !</h1>
    <p>Cette page a été poussée par Claude directement sur GitHub, et déployée automatiquement par GitHub Pages.</p>
    <button onclick="document.getElementById('c').textContent = parseInt(document.getElementById('c').textContent) + 1">
      Test JavaScript : <span id="c">0</span> clics
    </button>
  </div>
</body>
</html>
